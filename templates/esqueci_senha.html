{% extends "base.html" %}
{% block titulo %}Esqueci minha senha — Pro Champions{% endblock %}
{% block conteudo %}
<div class="pagina-popup">
  <div class="auth-wrapper">
    <img src="{{ url_for('static', filename='logo-home.png') }}" alt="Pro Champions" class="logo-auth">
    <form method="POST" class="auth-card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p class="auth-titulo">Esqueci minha senha</p>
        <p class="auth-subtitulo">Digite o e-mail da sua conta. Se ele estiver cadastrado, a gente manda um link para você escolher uma senha nova.</p>

        <div class="auth-campo">
            <svg class="auth-icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4Zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1H2Zm13 2.383-4.708 2.825L15 11.105V5.383Zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741ZM1 11.105l4.708-2.897L1 5.383v5.722Z" />
            </svg>
            <input type="email" id="email" name="email" class="auth-input" placeholder="E-mail" autocomplete="username" required>
        </div>

        <div class="auth-acoes">
            <button type="submit" class="auth-botao auth-botao-acento">Enviar link</button>
            <a href="{{ url_for('login') }}" class="auth-botao">Voltar</a>
        </div>
    </form>
  </div>
</div>
{% endblock %}
