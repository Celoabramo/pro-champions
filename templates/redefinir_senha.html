{% extends "base.html" %}
{% block titulo %}Redefinir senha — Pro Champions{% endblock %}
{% block conteudo %}
<div class="pagina-popup">
  <div class="auth-wrapper">
    <img src="{{ url_for('static', filename='logo-home.png') }}" alt="Pro Champions" class="logo-auth">
    <form method="POST" class="auth-card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <p class="auth-titulo">Escolher nova senha</p>

        <div class="auth-campo">
            <svg class="auth-icone" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z" />
            </svg>
            <input type="password" id="senha" name="senha" minlength="8" class="auth-input" placeholder="Nova senha (mínimo 8 caracteres)" autocomplete="new-password" required>
        </div>

        <div class="auth-acoes">
            <button type="submit" class="auth-botao auth-botao-acento">Salvar nova senha</button>
        </div>
    </form>
  </div>
</div>
{% endblock %}
